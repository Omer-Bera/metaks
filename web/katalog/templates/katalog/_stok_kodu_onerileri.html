{% if kayitlar %}
<div class="mt-1 rounded-lg border border-slate-200 bg-white shadow-lg overflow-hidden">
    {% for kayit in kayitlar %}
    <button type="button" onclick="skuSec('{{ kayit.sku_kodu|escapejs }}')"
       class="flex items-center gap-3 px-3 py-2 text-sm border-b last:border-0
              border-slate-100 hover:bg-slate-50 w-full text-left">
        {% if kayit.gorsel_url %}<img src="{{ kayit.gorsel_url }}" alt="" class="h-10 w-10 rounded border border-slate-200 object-contain">{% else %}<span class="h-10 w-10 rounded bg-slate-100"></span>{% endif %}
        <span class="min-w-0 flex-1"><span class="block font-mono text-slate-900">{{ kayit.sku_kodu }}</span>
        <span class="block truncate text-xs text-slate-400">ürün {{ kayit.urun_kodu }} · {{ kayit.kategori_adi|default:"Kategorisiz" }} · {{ kayit.montaj_durumu }}</span></span>
    </button>
    {% endfor %}
</div>
{% endif %}
