{% extends "katalog/base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold text-gray-900 mb-4">METAKS Ürün Kataloğu</h1>

    <input
        type="search"
        name="q"
        placeholder="Stok kodu, kategori, açıklama ara..."
        value="{{ arama }}"
        class="w-full max-w-md rounded-lg border border-gray-300 px-4 py-2 mb-6
               focus:outline-none focus:ring-2 focus:ring-indigo-500"
        hx-get="{% url 'katalog:urun_listesi' %}"
        hx-trigger="input changed delay:300ms, search"
        hx-target="#urun-grid"
        hx-swap="outerHTML"
        hx-push-url="true"
    >

    {% include "katalog/_urun_grid.html" %}
</div>
{% endblock %}
