<div id="urun-grid">
    <p class="text-sm text-gray-500 mb-4">{{ urunler|length }} ürün gösteriliyor{% if arama %} ("{{ arama }}" için){% endif %}</p>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        {% for urun in urunler %}
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
            <img src="{{ urun.gorsel_url }}" alt="{{ urun.stok_kodu }}"
                 class="w-full aspect-square object-cover bg-gray-100" loading="lazy">
            <div class="p-3">
                <p class="font-medium text-gray-900 text-sm">{{ urun.stok_kodu }}</p>
                <p class="text-xs text-gray-500">{{ urun.kategori_adi|default:"—" }}</p>
            </div>
        </div>
        {% empty %}
        <p class="col-span-full text-gray-500 py-12 text-center">Sonuç bulunamadı.</p>
        {% endfor %}
    </div>
</div>
