server {
    listen 80;
    server_name _;

    # images/final/products/ (aktif ürünlerin görselleri) buradan
    # dosya adıyla okunur: http://<host>:8083/urun-gorselleri/<dosya_adi>
    # urun_gorselleri.dosya_adi kolonundaki değer doğrudan bu path'e eklenir.
    location /urun-gorselleri/ {
        alias /usr/share/nginx/html/urun-gorselleri/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = / {
        return 404;
    }
}
