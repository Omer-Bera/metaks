# Proje adı BİLEREK sabitlenmiş. Compose, verilmezse projeyi bulunduğu dizinin
# adından türetir; adlandırılmış volume'ler de o önekle yaratılır
# (metaks_db_pg_data). Bu dosya 2026-07-31'de
# metaks_DB/ altından metaks/veritabani/ altına taşındığında önek "veritabani"
# olacak, yani compose var olan veritabanını görmeyip BOŞ yeni bir volume
# açacaktı. Sabit ad bu bağı dizin adından kopartıyor: klasör nereye taşınırsa
# taşınsın aynı veriye bağlanılıyor.
name: metaks_db

services:
  veritabani:
    image: postgres:16-alpine
    container_name: depo-postgres
    restart: always
    environment:
      POSTGRES_USER: depo_admin
      POSTGRES_PASSWORD: supergizlisifre
      POSTGRES_DB: depo_sistemi
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  # Ürün görsellerini HTTP üzerinden sunan statik dosya sunucusu — arayüzün
  # urun_gorselleri.dosya_adi'ndan gelen dosya adını doğrudan URL'e
  # çevirebilmesi için. images/final/products/ salt-okunur bağlanıyor;
  # DB'ye/dosyalara hiçbir yazma yapmıyor.
  gorsel-sunucu:
    image: nginx:alpine
    container_name: depo-gorsel-sunucu
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./images/final/products:/usr/share/nginx/html/urun-gorselleri:ro
      - ./docker/nginx/gorseller.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data: