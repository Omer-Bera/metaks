services:
  veritabani:
    image: postgres:16-alpine
    container_name: depo-postgres
    restart: always
    environment:
      POSTGRES_USER: depo_admin
      POSTGRES_PASSWORD: supergizlisifre
      POSTGRES_DB: depo_sistemi
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  # Deneme amaçlı: mevcut Postgres'e doğrudan bağlanan, düşük-kod
  # arayüz aracı. Veri taşımaz, sadece depo_sistemi'ni görselleştirir.
  # Kaldırmak icin: docker compose rm -sf nocodb
  nocodb:
    image: nocodb/nocodb:latest
    container_name: depo-nocodb
    restart: unless-stopped
    environment:
      # NocoDB varsayılan olarak Docker/iç ağ adreslerine bağlanmayı SSRF
      # korumasıyla engelliyor. Kendi self-hosted kurulumumuzda bu güvenli
      # ve gerekli, o yüzden izin veriyoruz.
      NC_ALLOW_LOCAL_HOSTS: "true"
    ports:
      - "8080:8080"
    volumes:
      - nc_data:/usr/app/data
    depends_on:
      - veritabani

  # Deneme amaçlı: başka bir açık kaynak düşük-kod arayüz aracı.
  # Kaldırmak icin: docker compose rm -sf appsmith
  appsmith:
    image: appsmith/appsmith-ce
    container_name: depo-appsmith
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - appsmith_data:/appsmith-stacks
    depends_on:
      - veritabani

volumes:
  pg_data:
  nc_data:
  appsmith_data: