services:
  veritabani:
    image: postgres:16-alpine
    container_name: depo-postgres
    restart: always
    environment:
      POSTGRES_USER: depo_admin
      POSTGRES_PASSWORD: supergizlisifre
      POSTGRES_DB: depo_sistemi
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  # Faz 5 arayüz katmanı için aktif seçim (NocoDB değerlendirildi ve terk
  # edildi — SSRF kısıtlaması aşılamadı, bkz. CLAUDE.md "UI / arayüz katmanı").
  appsmith:
    image: appsmith/appsmith-ce
    container_name: depo-appsmith
    restart: unless-stopped
    environment:
      # Davet e-postalarındaki linkin doğru adresi göstermesi için gerekli;
      # ayarlanmazsa "Invite users" tamamen engelleniyor (hesap zaten var
      # olsa bile). Tailscale/Headscale ağındaki Mac'in adresi kullanılıyor.
      APPSMITH_BASE_URL: "http://100.64.0.6:8082"
    ports:
      - "8082:80"
    volumes:
      - appsmith_data:/appsmith-stacks
    depends_on:
      - veritabani

  # Ürün görsellerini HTTP üzerinden sunan statik dosya sunucusu — Appsmith'in
  # (ve ileride başka arayüzlerin) urun_gorselleri.dosya_adi'ndan gelen dosya
  # adını doğrudan URL'e çevirebilmesi için. images/final/products/ salt-okunur
  # bağlanıyor; DB'ye/dosyalara hiçbir yazma yapmıyor.
  gorsel-sunucu:
    image: nginx:alpine
    container_name: depo-gorsel-sunucu
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./images/final/products:/usr/share/nginx/html/urun-gorselleri:ro
      - ./docker/nginx/gorseller.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:
  appsmith_data: